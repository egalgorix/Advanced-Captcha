<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Try server-side CAPTCHA verification.">
  <title>Advanced Captcha</title>
  <link rel="stylesheet" href="/captcha.css">
  <script src="/captcha.js" defer></script>
</head>
<body>
  <main>
    <header class="intro">
      <p class="product-name">Advanced Captcha</p>
      <h1>Verify the code</h1>
      <p id="challenge-help">Enter the six characters below. Case doesn’t matter.</p>
    </header>

    <form id="verification-form">
      <div class="picture">
        <img id="challenge-image" alt="Six-character CAPTCHA code" width="260" height="92" hidden>
        <span id="challenge-placeholder">Loading code…</span>
      </div>

      <div class="answer-row">
        <div class="answer-field">
          <label for="answer">Verification code</label>
          <input id="answer" name="answer" type="text" maxlength="6" minlength="6"
            aria-describedby="challenge-help" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        </div>
        <button type="button" id="refresh">New code</button>
      </div>

      <div hidden>
        <label for="reference">Leave this field empty</label>
        <input id="reference" name="reference" type="text" autocomplete="off" tabindex="-1" maxlength="256">
      </div>
      <div id="security-check" aria-label="Additional security verification" hidden></div>

      <div class="form-footer">
        <p id="status" role="status" aria-atomic="true"></p>
        <button id="submit" type="submit" disabled>Verify</button>
      </div>
      <noscript>JavaScript is required to verify the code.</noscript>
    </form>
  </main>
</body>
</html>
